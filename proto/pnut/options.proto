// pnut-os's own options, read by tools/protoc-gen-pnut (RFC 0023): what
// the library needs to know of an interface and its topics beyond their
// messages.

syntax = "proto2";

package pnut;

import "google/protobuf/descriptor.proto";

extend google.protobuf.ServiceOptions {
  // The interface's number, from proto/interfaces.md; never reused
  optional uint32 iface = 51000;
}

extend google.protobuf.MessageOptions {
  // The uORB topic the message is published on (RFC 0005): lowercase
  // letters, digits and underscores, at most 20 of them (uORB's path to
  // it, /dev/uorb/<name><instance>, must fit 32 bytes), one topic to a
  // top-level message
  optional string topic = 51000;

  // How many messages the topic keeps for a reader who has not read them:
  // one for a topic that carries state, more for events
  optional uint32 depth = 51001 [default = 1];
}

extend google.protobuf.MethodOptions {
  // The method's number in its interface, from 1; never reused
  optional uint32 method = 51000;

  // The method's version, from 1: a new one when its messages change
  // meaning (RFC 0005)
  optional uint32 version = 51001 [default = 1];

  // The permission a caller needs (RFC 0009); none when empty
  optional string permission = 51002;
}

// A service's settings (RFC 0025): a message whose fields are the settings
// of one owner, declared with the setting option below.  The generator
// writes the schema the service registers, and typed access to the values
// (<file>.settings.h): the message's own struct holds them.
//
//   message WifiSettings {
//     option (pnut.settings) = "wifi";
//     sint32 power = 1 [(pnut.setting) = { min: 0, max: 20, default: "10",
//                                          unit: "dBm", label: "Power",
//                                          group: "Radio" }];
//     string region = 2 [(pnut.setting) = { choices: ["eu", "us"],
//                                           default: "eu", public: true },
//                        (nanopb).max_size = 3];
//   }
//
// A bool field is a boolean; an integer field an integer, its range the
// field type's unless given; a string field a string, as long as its
// nanopb max_size allows (up to 256 bytes), or a choice when it has
// choices; a string field marked secret a secret (sealed by Settings,
// never in the struct's values: read and set through the cache's own
// calls).  At most 64 settings to an owner.
extend google.protobuf.MessageOptions {
  // The owner: the service's name
  optional string settings = 51002;
}

message SettingOptions {
  // The key, when it is not the field's name: lowercase letters, digits,
  // dots and underscores; not log.level, which the library adds to an
  // owner named as its module (RFC 0026)
  optional string key = 1;

  // The default, written as text: "true", "10", "eu"; the type's zero
  // (false, 0, empty, the first choice) when left out
  optional string default = 2;

  // An integer's range
  optional sint64 min = 3;
  optional sint64 max = 4;

  // A choice's values
  repeated string choices = 5;

  // For the screens: string ids the system UI translates (RFC 0017)
  optional string label = 6;
  optional string group = 7;
  optional string unit = 8;

  // Anyone may read it (RFC 0025)
  optional bool public = 9;

  // Stored sealed (RFC 0025); a string field, as long as its nanopb
  // max_size allows.  No default, never public; read only by the program
  // that runs its owner
  optional bool secret = 10;
}

extend google.protobuf.FieldOptions {
  optional SettingOptions setting = 51000;

  // A field that holds a secret: a PIN, a passphrase, a key (RFC 0026).
  // The generated code wipes every copy of a message that has one once it
  // is used: a request after its handler returns (a handler copies what
  // it keeps), a reply once queued, and a client's decoded reply after its
  // done callback; libpnut wipes its connections' buffers behind every
  // message as it goes.  Not for a stream's messages.
  optional bool sensitive = 51001;
}
