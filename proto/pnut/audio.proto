// Audio (RFC 0032), a module of the media program: it owns the codec, the
// amplifier and the switch in front of it, the speaker and the microphone.
// Sounds play mixed together, each with a use that sets its volume and how
// it meets the others: alarm and ring mute the lower uses while they play,
// a notification ducks them, the interface's sounds and media mix as they
// are.  So far: built-in sounds, by name.

syntax = "proto3";

package pnut;

import "nanopb.proto";
import "pnut/options.proto";

service Audio {
  option (pnut.iface) = 10;

  // A built-in sound, with its use, once or looping: answered with a
  // handle once it is mixed in.  If the speaker then fails, the audio
  // topic says it no longer plays
  rpc Play (AudioPlayRequest) returns (AudioPlayReply) {
    option (pnut.method) = 1;
  }

  // A sound, by its handle
  rpc Stop (AudioStopRequest) returns (AudioReply) {
    option (pnut.method) = 2;
  }
}

message AudioError {
  enum Code {
    NONE = 0;
    NO_SPEAKER = 1;               // The device has none, or it failed
    NO_SOUND = 2;                 // No built-in sound of that name
    FULL = 3;                     // As many sounds play as can
    NOT_PLAYING = 4;              // Stop: no sound of that handle
  }
}

// What a sound is for, lowest first
enum AudioUse {
  AUDIO_USE_MEDIA = 0;            // Music, podcasts, games, apps' sounds
  AUDIO_USE_INTERFACE = 1;        // Key clicks, the system UI's sounds
  AUDIO_USE_NOTIFICATION = 2;
  AUDIO_USE_RING = 3;             // An incoming call
  AUDIO_USE_ALARM = 4;
}

message AudioPlayRequest {
  string name = 1 [(nanopb).max_size = 16];   // A built-in sound
  AudioUse use = 2;
  bool loop = 3;                  // Until stopped
}

message AudioPlayReply {
  uint32 handle = 1;
}

message AudioStopRequest {
  uint32 handle = 1;
}

message AudioReply {
}

// What plays: a bit for each use playing (1 << use), for the system UI and
// tests
message AudioInfo {
  option (pnut.topic) = "audio";

  uint32 uses = 1;
}

message AudioSettings {
  option (pnut.settings) = "audio";

  // The volumes (RFC 0032), 0 to 10: ring, alarms (never below 1),
  // notifications and the interface's sounds; media; calls
  uint32 volume_ring = 1 [(pnut.setting) = { key: "volume.ring",
                                             default: "6",
                                             label: "audio.volume.ring",
                                             public: true, min: 0,
                                             max: 10 }];
  uint32 volume_media = 2 [(pnut.setting) = { key: "volume.media",
                                              default: "6",
                                              label: "audio.volume.media",
                                              public: true, min: 0,
                                              max: 10 }];
  uint32 volume_call = 3 [(pnut.setting) = { key: "volume.call",
                                             default: "6",
                                             label: "audio.volume.call",
                                             public: true, min: 0,
                                             max: 10 }];
}
