// An interface for libpnut's tests of the generated code

syntax = "proto3";

package pnut.test;

import "nanopb.proto";
import "pnut/options.proto";

service Echo {
  option (pnut.iface) = 65000;

  // Answers with the text, and how many times anything was said
  rpc Say (SayRequest) returns (SayReply) {
    option (pnut.method) = 1;
    option (pnut.permission) = "test.say";
  }

  // How many times anything was said; the tests leave it unserved
  rpc Count (CountRequest) returns (CountReply) {
    option (pnut.method) = 2;
    option (pnut.version) = 2;
  }

  // Ticks numbered from 1, as many as asked for, as the caller's credit
  // allows; then the stream ends
  rpc Ticks (TicksRequest) returns (stream Ticked) {
    option (pnut.method) = 3;
  }

  // A secret, and the same back: no copy of it is left behind
  rpc Whisper (WhisperRequest) returns (WhisperReply) {
    option (pnut.method) = 4;
  }
}

message WhisperRequest {
  string secret = 1 [(nanopb).max_size = 32, (pnut.sensitive) = true];
}

message WhisperReply {
  string secret = 1 [(nanopb).max_size = 32, (pnut.sensitive) = true];
}

message TicksRequest {
  uint32 count = 1;
}

message Ticked {
  uint32 number = 1;
}

message SayRequest {
  string text = 1 [(nanopb).max_size = 64];
}

message SayReply {
  string text = 1 [(nanopb).max_size = 64];
  uint32 count = 2;
}

message CountRequest {
}

message CountReply {
  uint32 count = 1;
}
