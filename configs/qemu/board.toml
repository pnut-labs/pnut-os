#
# The QEMU target's description (RFC 0024): Espressif's QEMU emulating an
# ESP32-S3, with a console and none of a device's parts.  The build checks
# it against pnut.BoardDescription (proto/pnut/board.proto) and compiles it
# into /etc/pnut/board.pb, which Board serves.

[identity]
maker = "Espressif"
model = "ESP32-S3 in QEMU"
