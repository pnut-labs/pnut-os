# The checks on every pull request: the simulator's target builds, and the
# code follows NuttX's style.  QEMU's and the device's targets join once a
# container image holds Espressif's toolchain.

name: Build

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the older run

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim:
    name: build-sim
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install the host's tools
        run: |
          sudo apt-get update
          sudo apt-get install -y kconfig-frontends python3-kconfiglib \
            genromfs xxd zlib1g-dev

      - name: Build
        run: make sim

  style:
    name: style
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Check
        run: make style
